<section class="login-card">
  <a routerLink="/" class="back">← Zur Startseite</a>
  <h1>Anmelden</h1>
  <p class="hint">Verwenden Sie eine beliebige E-Mail und ein Passwort (mind. 4 Zeichen).</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>E-Mail</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="ihre@email.de" />
    </label>

    <label>
      <span>Passwort</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••" />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Wird angemeldet…' : 'Anmelden' }}
    </button>
  </form>
</section>
